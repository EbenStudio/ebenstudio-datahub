here<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebenstudio Data Hub</title>

  <script src="https://js.paystack.co/v2/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.85;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      margin-top: 22px;
      border: none;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #price {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Ebenstudio Data Hub</h1>
  <p>Fast and reliable data bundles</p>
</header>

<div class="container">
  <div class="card">

    <h2>Buy Data</h2>

    <form id="orderForm">

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="0241234567"
        required
      >

      <label for="network">Network</label>
      <select id="network" required>
        <option value="">Select network</option>
        <option value="MTN">MTN</option>
        <option value="Telecel">Telecel</option>
        <option value="AirtelTigo">AirtelTigo</option>
      </select>

      <label for="plan">Data Bundle</label>
      <select id="plan" required>
        <option value="">Select bundle</option>
      </select>

      <div id="price">Price: GH₵0.00</div>

      <button type="submit" id="submitButton">
        Pay Now
      </button>

    </form>

    <div id="message"></div>

  </div>
</div>

<script>
  const PAYSTACK_PUBLIC_KEY = "YOUR_PAYSTACK_PUBLIC_KEY";

  const plans = {
    MTN: [
      { gb: 1, price: 6.00 },
      { gb: 2, price: 10.00 },
      { gb: 5, price: 25.80 },
      { gb: 10, price: 50.00 }
    ],

    Telecel: [
      { gb: 10, price: 42.00 },
      { gb: 20, price: 78.00 },
      { gb: 50, price: 180.50 }
    ],

    AirtelTigo: [
      { gb: 1, price: 6.00 },
      { gb: 2, price: 14.00 },
      { gb: 5, price: 24.00 },
      { gb: 10, price: 45.00 }
    ]
  };

  const networkSelect = document.getElementById("network");
  const planSelect = document.getElementById("plan");
  const priceDisplay = document.getElementById("price");
  const form = document.getElementById("orderForm");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");

  networkSelect.addEventListener("change", () => {
    const network = networkSelect.value;

    planSelect.innerHTML =
      '<option value="">Select bundle</option>';

    priceDisplay.textContent = "Price: GH₵0.00";

    if (!plans[network]) return;

    plans[network].forEach((plan, index) => {
      const option = document.createElement("option");

      option.value = index;
      option.textContent =
        `${plan.gb}GB — GH₵${plan.price.toFixed(2)}`;

      planSelect.appendChild(option);
    });
  });

  planSelect.addEventListener("change", () => {
    const network = networkSelect.value;
    const index = planSelect.value;

    if (!plans[network] || index === "") {
      priceDisplay.textContent = "Price: GH₵0.00";
      return;
    }

    const selectedPlan = plans[network][index];

    priceDisplay.textContent =
      `Price: GH₵${selectedPlan.price.toFixed(2)}`;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const network = networkSelect.value;
    const index = planSelect.value;

    if (!plans[network] || index === "") {
      alert("Please select a data bundle.");
      return;
    }

    const selectedPlan = plans[network][index];

    if (
      !PAYSTACK_PUBLIC_KEY ||
      PAYSTACK_PUBLIC_KEY === "YOUR_PAYSTACK_PUBLIC_KEY"
    ) {
      alert("Paystack has not been configured yet.");
      return;
    }

    button.disabled = true;
    button.textContent = "Opening payment...";

    const popup = new Paystack();

    popup.checkout({
      key: PAYSTACK_PUBLIC_KEY,
      email: email,
      amount: Math.round(selectedPlan.price * 100),
      currency: "GHS",

      onSuccess: async (transaction) => {

        message.style.display = "block";
        message.textContent =
          "Payment received. Verifying your payment...";

        try {
          const response = await fetch("/api/payment/verify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              reference: transaction.reference,
              phone_number: phone,
              network: network,
              plan_size_gb: selectedPlan.gb
            })
          });

          const result = await response.json();

          if (result.success) {
            message.textContent =
              "Payment verified and your data order has been submitted. " +
              "Reference: " +
              (result.data?.transactionReference ||
               transaction.reference);
          } else {
            message.textContent =
              result.message ||
              "Payment was received, but the order could not be submitted.";
          }

        } catch (error) {
          message.textContent =
            "Payment was received, but we could not confirm the order. Please contact support.";
        }

        button.disabled = false;
        button.textContent = "Pay Now";
      },

      onCancel: () => {
        message.style.display = "block";
        message.textContent = "Payment cancelled.";

        button.disabled = false;
        button.textContent = "Pay Now";
      }
    });
  });
</script>

</body>
  </html>
